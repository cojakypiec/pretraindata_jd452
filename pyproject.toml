[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cojakypiec-pretraindata_jd452"
version = "0.1.0"
description = "从样本里推断预训练数据工程师·偏好数据的成对噪声应有的字段集合，逐字段检查存在性与类型，缺失项单独列出"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "cojakypiec" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://cojakypiec.github.io"
Repository = "https://github.com/cojakypiec/pretraindata_jd452"
Issues = "https://github.com/cojakypiec/pretraindata_jd452/issues"

[project.scripts]
pretraindata_jd452 = "pretraindata_jd452:main"

[tool.setuptools]
py-modules = ["pretraindata_jd452"]
